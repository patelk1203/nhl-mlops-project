<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL AI Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .progress-bar-home { transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .progress-bar-away { transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <div class="glass-panel rounded-3xl shadow-2xl w-full max-w-xl p-8 border border-slate-700/50">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">
                NHL AI Predictor
            </h1>
            <p class="text-slate-400 text-sm">Real-time Game Analysis</p>
        </div>

        <div class="flex gap-4 mb-8">
            <div class="flex-1">
                <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">Home</label>
                <select id="home-team" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white font-bold outline-none focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div class="flex items-center pt-6 text-slate-600 font-bold">VS</div>
            <div class="flex-1">
                <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">Away</label>
                <select id="away-team" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white font-bold outline-none focus:ring-2 focus:ring-emerald-500"></select>
            </div>
        </div>

        <button id="predict-btn" class="w-full bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg transition duration-200 hover:-translate-y-0.5">
            Analyze Matchup
        </button>

        <div id="results-panel" class="hidden mt-8">
            <div class="flex justify-between items-end mb-3 px-2">
                <div class="text-left">
                    <div class="text-xs text-slate-500 font-bold uppercase">Home Win</div>
                    <div id="home-prob-text" class="text-3xl font-black text-blue-400">0%</div>
                </div>
                <div class="text-right">
                    <div class="text-xs text-slate-500 font-bold uppercase">Away Win</div>
                    <div id="away-prob-text" class="text-3xl font-black text-emerald-400">0%</div>
                </div>
            </div>
            
            <div class="w-full h-4 bg-slate-900 rounded-full overflow-hidden flex shadow-inner border border-slate-800">
                <div id="home-bar" class="progress-bar-home h-full bg-blue-500 w-0"></div>
                <div id="away-bar" class="progress-bar-away h-full bg-emerald-500 w-0"></div>
            </div>
        </div>
    </div>

    <script>
        const teams = ['ANA', 'ARI', 'BOS', 'BUF', 'CAR', 'CBJ', 'CGY', 'CHI', 'COL', 'DAL', 'DET', 'EDM', 'FLA', 'LAK', 'MIN', 'MTL', 'NJD', 'NSH', 'NYI', 'NYR', 'OTT', 'PHI', 'PIT', 'SEA', 'SJS', 'STL', 'TBL', 'TOR', 'UTA', 'VAN', 'VGK', 'WPG', 'WSH'];
        const homeSelect = document.getElementById('home-team');
        const awaySelect = document.getElementById('away-team');
        
        teams.forEach(team => { homeSelect.add(new Option(team, team)); awaySelect.add(new Option(team, team)); });
        homeSelect.value = 'TOR'; awaySelect.value = 'BOS';

        document.getElementById('predict-btn').addEventListener('click', async () => {
            const btn = document.getElementById('predict-btn');
            const resultsPanel = document.getElementById('results-panel');
            btn.innerText = "Processing...";
            
            try {
                const res = await fetch(`http://98.88.84.128:8000/predict?home=${homeSelect.value}&away=${awaySelect.value}`);
                const data = await res.json();
                
                const homeProb = parseFloat(data.home_win_probability);
                const awayProb = parseFloat(data.away_win_probability);

                document.getElementById('home-prob-text').innerText = `${homeProb.toFixed(0)}%`;
                document.getElementById('away-prob-text').innerText = `${awayProb.toFixed(0)}%`;
                document.getElementById('home-bar').style.width = `${homeProb}%`;
                document.getElementById('away-bar').style.width = `${awayProb}%`;

                resultsPanel.classList.remove('hidden');
            } catch (err) {
                alert("Error connecting to API. Is the server running?");
            } finally {
                btn.innerText = "Analyze Matchup";
            }
        });
    </script>
</body>
</html>
